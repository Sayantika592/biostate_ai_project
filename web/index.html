<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Song to Dance</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --text:#e8eaf0; --muted:#9aa3b2; --accent:#ff7a59; --line:#2a2f3a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0 12px 0 0; }
  label { color:var(--muted); font-size:13px; display:flex; gap:6px; align-items:center; }
  input[type=number] { width:64px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 6px; }
  button, .btn { background:var(--accent); color:#111; border:0; border-radius:8px; padding:7px 14px; font-weight:600; cursor:pointer; text-decoration:none; font-size:14px; }
  button:disabled, .btn.off { opacity:.4; pointer-events:none; }
  .ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  #status { color:var(--muted); font-size:13px; }
  #stage { flex:1; position:relative; min-height:0; }
  canvas { display:block; }
  #mode { margin-left:auto; font-size:12px; color:var(--muted); }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<header>
  <h1>Song to Dance</h1>
  <input id="file" type="file" accept="audio/*">
  <label>Start (s) <input id="start" type="number" value="0" min="0" step="1"></label>
  <label>Length (s) <input id="seconds" type="number" value="10" min="5" max="30" step="5"></label>
  <button id="go">Generate</button>
  <button id="play" class="ghost" disabled>Play</button>
  <a id="bvh" class="btn ghost off" href="#">BVH</a>
  <a id="json" class="btn ghost off" href="#">JSON</a>
  <span id="status">Pick a song to start.</span>
  <span id="mode"></span>
</header>
<div id="stage"></div>
<audio id="audio"></audio>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const stage = $("stage"), audio = $("audio");

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1115);
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
camera.position.set(0, 1.3, 4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(2, 4, 3); scene.add(sun);
scene.add(new THREE.GridHelper(10, 20, 0x444a58, 0x252a34));

const jointMat = new THREE.MeshStandardMaterial({ color: 0xff7a59 });
const boneMat = new THREE.MeshStandardMaterial({ color: 0xdfe3ea });
let dance = null, joints = [], bones = [];

function buildSkeleton(parents) {
  [...joints, ...bones].forEach((m) => scene.remove(m));
  joints = parents.map(() => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 12), jointMat); scene.add(m); return m; });
  bones = parents.map((p) => { if (p < 0) return null; const m = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 1, 10), boneMat); scene.add(m); return m; });
}

const up = new THREE.Vector3(0, 1, 0), a = new THREE.Vector3(), b = new THREE.Vector3();
function pose(frame) {
  const f = dance.frames[frame];
  f.forEach((p, j) => joints[j].position.set(p[0], p[1], p[2]));
  dance.parents.forEach((p, j) => {
    if (p < 0) return;
    a.fromArray(f[p]); b.fromArray(f[j]);
    const bone = bones[j], len = a.distanceTo(b);
    bone.position.copy(a).add(b).multiplyScalar(0.5);
    bone.scale.set(1, len, 1);
    bone.quaternion.setFromUnitVectors(up, b.clone().sub(a).normalize());
  });
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

renderer.setAnimationLoop(() => {
  if (dance) {
    const n = dance.frames.length;
    pose(Math.min(n - 1, Math.floor(audio.currentTime * dance.fps)));
  }
  controls.update(); renderer.render(scene, camera);
});

const status = (s) => ($("status").textContent = s);
fetch("/api/health").then((r) => r.json()).then((h) => {
  $("mode").textContent = h.mode === "edge" ? "Model: EDGE" : "Model: demo (no GPU)";
});

$("play").onclick = () => (audio.paused ? audio.play() : audio.pause());
audio.onplay = () => ($("play").textContent = "Pause");
audio.onpause = () => ($("play").textContent = "Play");

$("go").onclick = async () => {
  const file = $("file").files[0];
  if (!file) return status("Pick a song first.");
  $("go").disabled = true; audio.pause();
  const fd = new FormData();
  fd.append("file", file); fd.append("start", $("start").value); fd.append("seconds", $("seconds").value);
  try {
    let job = await (await fetch("/api/generate", { method: "POST", body: fd })).json();
    while (job.status !== "done" && job.status !== "error") {
      status(job.status[0].toUpperCase() + job.status.slice(1) + "…");
      await new Promise((r) => setTimeout(r, 1500));
      job = await (await fetch(`/api/jobs/${job.id}`)).json();
    }
    if (job.status === "error") throw new Error(job.error);
    const base = `/api/jobs/${job.id}`;
    dance = await (await fetch(`${base}/motion.json`)).json();
    buildSkeleton(dance.parents);
    audio.src = `${base}/clip.wav`;
    $("bvh").href = `${base}/motion.bvh`; $("json").href = `${base}/motion.json`;
    ["bvh", "json"].forEach((id) => $(id).classList.remove("off"));
    $("play").disabled = false;
    status(`Ready: ${job.seconds}s dance. Press Play, or Generate again for a new take.`);
    audio.play().catch(() => {});
  } catch (e) {
    status("Failed: " + e.message);
  } finally {
    $("go").disabled = false;
  }
};
</script>
</body>
</html>
